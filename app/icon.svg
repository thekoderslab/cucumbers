<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Lime tile so the mark holds its shape against dark and light tab bars. -->
  <rect width="64" height="64" rx="14" fill="#CCFF00"/>
  <g transform="rotate(-24 32 32)">
    <!-- Body -->
    <rect x="23" y="7" width="18" height="50" rx="9" fill="#1f5c14"/>
    <rect x="25" y="9" width="14" height="46" rx="7" fill="#3f9c24"/>
    <!-- Highlight down one side -->
    <rect x="27.5" y="12" width="4" height="40" rx="2" fill="#7ed94a" opacity="0.85"/>
    <!-- Speckles -->
    <g fill="#1f5c14" opacity="0.55">
      <circle cx="35" cy="18" r="1.6"/>
      <circle cx="34" cy="30" r="1.6"/>
      <circle cx="35.5" cy="42" r="1.6"/>
      <circle cx="29" cy="48" r="1.6"/>
    </g>
  </g>
</svg>
